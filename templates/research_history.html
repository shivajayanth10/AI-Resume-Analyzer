<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research History</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            color: #3b82f6;
            margin-bottom: 30px;
        }

        .card {
            background: #1f2937;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #374151;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 15px;
        }

        .result {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #e5e7eb;
        }

        .date {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .empty {
            background: #1f2937;
            padding: 30px;
            border-radius: 12px;
            color: #9ca3af;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/research" class="back">← Back to Research Agent</a>

    <h1>Research Knowledge Base</h1>

    {% if records %}

        {% for record in records %}

        <div class="card">

            <div class="question">
                {{ record.question }}
            </div>

            {% if record.created_at %}
            <div class="date">
                Created: {{ record.created_at }}
            </div>
            {% endif %}

            <div class="result">
                {{ record.result }}
            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            No research has been saved yet.
        </div>

    {% endif %}

</div>

</body>
</html>
